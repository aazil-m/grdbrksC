server {
    listen 80;
    root /usr/share/nginx/html;

    # API requests go to the backend container (same origin, so no CORS needed).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
