[project]
name = "wind-forecast-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime dependencies, kept identical to requirements.txt (enforced by tests/test_dependencies.py).
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
